<!-- ZakoWhat Global Masthead / Navigation Component -->
{% from "components/brand_mark.html" import brand_mark %}
<header class="masthead">
  <div class="masthead-inner">
    <!-- Brand Identity Link -->
    <a href="/" class="brand-link" aria-label="ZakoWhat bosh sahifa">
      {{ brand_mark("header") }}
      <span class="brand-title">ZakoWhat</span>
    </a>

    <!-- Desktop Navigation Links (Standardized Order) -->
    <nav class="nav-actions nav-desktop items-center gap-5" aria-label="Asosiy navigatsiya">
      <a href="/" id="nav-link-home" class="nav-link">Bosh sahifa</a>
      <a href="/daily" id="nav-link-daily" class="nav-link">Kun savoli</a>
      <a href="/arena" id="nav-link-packs" onclick="handleNavbarPacks(event)" class="nav-link">To‘plamlar</a>
    </nav>

    <!-- Right Controls: Theme Toggle + Account Area + Mobile Hamburger -->
    <div class="masthead-right-controls">
      <!-- Live Theme Toggle Button (Architectural Dial) -->
      <button id="themeToggleBtn" class="theme-toggle-btn" type="button" aria-label="Mavzuni almashtirish" title="Mavzuni almashtirish" onclick="toggleZakoWhatTheme()">
        <svg id="moonIcon" class="theme-icon moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
        <svg id="sunIcon" class="theme-icon sun-icon" style="display:none;" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="2" x2="12" y2="6"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
      </button>

      <!-- Account Actions (Desktop) -->
      <div id="header-auth-section" class="masthead-auth auth-desktop">
        <!-- Guest Controls -->
        <div id="header-guest-controls" class="header-guest-controls">
          <button type="button" onclick="handleNavbarAuth('login')" class="btn btn-secondary header-auth-btn">
            Kirish
          </button>
          <button type="button" onclick="handleNavbarAuth('register')" class="btn btn-primary header-auth-btn">
            Ro‘yxatdan o‘tish
          </button>
        </div>

        <!-- Authenticated Controls -->
        <div id="header-user-controls" class="header-user-controls hidden">
          <a href="/profile" onclick="handleNavbarProfile(event)" class="header-user-link" title="Profilim">
            <span class="header-user-avatar">
              <img id="header-user-avatar-img" class="header-user-avatar-img hidden" alt="Avatar">
              <svg id="header-user-avatar-svg" width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
              </svg>
            </span>
            <span id="header-user-name" class="header-user-name">Foydalanuvchi</span>
          </a>
          <a href="/profile" onclick="handleNavbarProfile(event)" class="header-profile-link">
            Profilim
          </a>
          <button type="button" onclick="handleNavbarLogout()" class="header-logout-btn" title="Akkauntdan chiqish">
            Chiqish
          </button>
        </div>
      </div>

      <!-- Mobile Menu Hamburger Button -->
      <button id="mobileMenuToggleBtn" class="mobile-menu-btn inline-flex items-center justify-center w-9 h-9 rounded-md border border-[var(--border-subtle)] bg-[var(--bg-card)] text-[var(--text-main)] hover:border-[var(--accent-brass)] transition-colors" type="button" aria-label="Menyuni ochish" onclick="toggleMobileNav()">
        <svg id="hamburgerIcon" class="w-5 h-5" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
        <svg id="closeMenuIcon" class="w-5 h-5 hidden" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
  </div>

  <!-- Mobile Drawer Menu -->
  <div id="mobileNavDrawer" class="mobile-nav-drawer hidden border-t border-[var(--border-subtle)] bg-[var(--bg-card)] px-4 py-4 space-y-3 transition-all">
    <nav class="flex flex-col space-y-2">
      <a href="/" id="mobile-link-home" class="nav-link px-3 py-2 rounded-md hover:bg-white/5 transition-colors">Bosh sahifa</a>
      <a href="/daily" id="mobile-link-daily" class="nav-link px-3 py-2 rounded-md hover:bg-white/5 transition-colors">Kun savoli</a>
      <a href="/arena" id="mobile-link-packs" onclick="handleNavbarPacks(event)" class="nav-link px-3 py-2 rounded-md hover:bg-white/5 transition-colors">To‘plamlar</a>
    </nav>

    <!-- Mobile Account Controls -->
    <div id="mobile-auth-section" class="mobile-auth-section">
      <div id="mobile-guest-controls" class="flex flex-col gap-2">
        <button type="button" onclick="handleNavbarAuth('login')" class="btn btn-secondary w-full text-center text-xs py-2">
          Kirish
        </button>
        <button type="button" onclick="handleNavbarAuth('register')" class="btn btn-primary w-full text-center text-xs py-2">
          Ro‘yxatdan o‘tish
        </button>
      </div>
      <div id="mobile-user-controls" class="mobile-user-controls hidden">
        <div class="mobile-user-info">
          <span class="text-xs font-semibold text-[var(--text-dim)]">Akkaunt:</span>
          <span id="mobile-user-name" class="text-xs font-bold text-[var(--text-main)] truncate max-w-[180px]"></span>
        </div>
        <a href="/profile" onclick="handleNavbarProfile(event)" class="btn btn-secondary w-full text-center text-xs py-2">
          Profilim
        </a>
        <button type="button" onclick="handleNavbarLogout()" class="btn btn-secondary mobile-logout-btn w-full text-center text-xs py-2">
          Chiqish
        </button>
      </div>
    </div>
  </div>
</header>
